[package]
name = "swipeface"
version = "0.1.0"
edition = "2024"
description = "An elegant, keyboard-driven font viewer"

[dependencies]
iced = { version = "0.14", features = ["advanced"] }
ttf-parser = "0.25"
memmap2 = "0.9"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# Text shaping and rasterisation are painfully slow unoptimised.
[profile.dev.package."*"]
opt-level = 2
